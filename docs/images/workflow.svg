<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="title desc"><title id="title">Agent2B: shared controls and plugin tools</title><desc id="desc">A request follows a fixed flow or bounded exploration. Tool calls use a shared pipeline before returning results.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8b98a5"/></marker></defs><rect width="880" height="370" rx="12" fill="#f6f8fa"/><path d="M148 144H170V72H194" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M148 144H170V202H194" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M414 72H442V130H466" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M414 202H442V158H466" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M696 144H744" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="100" width="128" height="88" rx="9" fill="white" stroke="#d1d9e0"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="84.0" y="133" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">Request</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="84.0" y="158" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">Interpret &amp; route</text><rect x="194" y="30" width="220" height="85" rx="9" fill="white" stroke="#d1d9e0"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="304.0" y="63" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">Fixed flow</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="304.0" y="88" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">Preconfigured work</text><rect x="194" y="160" width="220" height="85" rx="9" fill="white" stroke="#d1d9e0"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="304.0" y="193" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">Exploration</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="304.0" y="218" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">Multi-turn tool use</text><rect x="466" y="90" width="230" height="108" rx="9" fill="#eaf3ff" stroke="#8bb8ed"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="581.0" y="121" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">Shared control pipeline</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="581.0" y="146" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">Permissions · validation</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="581.0" y="171" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">Approve writes · audit</text><rect x="744" y="100" width="116" height="88" rx="9" fill="white" stroke="#d1d9e0"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="802.0" y="133" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">Result</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="802.0" y="158" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">Explain &amp; trace</text><path d="M580 198V260H304V245" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="480" y="247" text-anchor="middle" font-size="13" fill="#59636e">Observe results; choose the next call</text><rect x="194" y="282" width="502" height="44" rx="8" fill="#eef6f1" stroke="#b4d3be"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="445" y="310" text-anchor="middle" font-size="16" fill="#28553b">Shared business tool plugins · declared contracts</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="440" y="352" text-anchor="middle" font-size="13" fill="#59636e">A denied or failed fixed flow cannot bypass checks through exploration.</text></svg>
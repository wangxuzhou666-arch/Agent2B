<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="title desc"><title id="title">Agent2B：统一管理的插件化工作流</title><desc id="desc">请求进入固定流程或受控探索，每次工具调用经过统一执行管道，再返回结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8b98a5"/></marker></defs><rect width="880" height="370" rx="12" fill="#f6f8fa"/><path d="M148 144H170V72H194" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M148 144H170V202H194" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M414 72H442V130H466" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M414 202H442V158H466" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M696 144H744" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="100" width="128" height="88" rx="9" fill="white" stroke="#d1d9e0"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="84.0" y="133" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">业务请求</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="84.0" y="158" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">理解与路由</text><rect x="194" y="30" width="220" height="85" rx="9" fill="white" stroke="#d1d9e0"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="304.0" y="63" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">固定流程</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="304.0" y="88" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">预先配置的工作</text><rect x="194" y="160" width="220" height="85" rx="9" fill="white" stroke="#d1d9e0"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="304.0" y="193" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">受控探索</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="304.0" y="218" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">多轮工具调用</text><rect x="466" y="90" width="230" height="108" rx="9" fill="#eaf3ff" stroke="#8bb8ed"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="581.0" y="121" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">统一管理与执行</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="581.0" y="146" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">权限 · 参数 · 输出校验</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="581.0" y="171" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">写入先批准 · 留审计</text><rect x="744" y="100" width="116" height="88" rx="9" fill="white" stroke="#d1d9e0"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="802.0" y="133" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">结果</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="802.0" y="158" text-anchor="middle" font-size="14" font-weight="400" fill="#59636e">解释与追溯</text><path d="M580 198V260H304V245" fill="none" stroke="#8b98a5" stroke-width="1.6" marker-end="url(#arrow)"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="480" y="247" text-anchor="middle" font-size="13" fill="#59636e">观察结果，再决定下一轮</text><rect x="194" y="282" width="502" height="44" rx="8" fill="#eef6f1" stroke="#b4d3be"/><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="445" y="310" text-anchor="middle" font-size="16" fill="#28553b">共用业务工具插件 · 按契约接入</text><text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" x="440" y="352" text-anchor="middle" font-size="13" 